<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}TripiWiki — Multi-Country Travel Guide & Interactive Map{% endblock %}</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/static/styles.css" />
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/carousel.js?v=2" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="header-top">
        <a href="/" class="brand">
          <span class="brand-badge">TW</span>
          <span class="brand-name">tripiwiki</span>
        </a>
        <div class="header-mobile-actions">
          <a href="/railway" class="nav-railway mobile-rail-btn">🚆 Railway</a>
          <button
            type="button"
            class="nav-toggle"
            aria-label="Toggle navigation menu"
            aria-expanded="false"
            onclick="const nav = document.getElementById('top-nav'); const open = nav.classList.toggle('open'); this.setAttribute('aria-expanded', open);"
          >
            ☰
          </button>
        </div>
      </div>
      <nav id="top-nav" class="top-nav">
        <a href="/">Explore All</a>
        {% for c in countries %}
        <a href="/?country={{ c.slug }}">{{ c.name }} ({{ c.count }})</a>
        {% endfor %}
        <a href="/#route-builder-panel">🧭 Trip Builder</a>
        <a href="/railway" class="nav-railway desktop-rail-link">🚆 Railway</a>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>TripiWiki — Local travel guides, interactive maps, full-year climate data &amp; custom route planning.</p>
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
