<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Laos Wiki — Local Travel Guide & Interactive Map{% endblock %}</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/static/styles.css" />
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/carousel.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="header-top">
        <a href="/" class="brand">
          <span class="brand-badge">LAO</span>
          <span class="brand-name">laos.wiki</span>
        </a>
        <div class="header-mobile-actions">
          <a href="/railway" class="nav-railway mobile-rail-btn">🚆 Railway</a>
          <button
            type="button"
            class="nav-toggle"
            aria-label="Toggle navigation menu"
            aria-expanded="false"
            onclick="const nav = document.getElementById('top-nav'); const open = nav.classList.toggle('open'); this.setAttribute('aria-expanded', open);"
          >
            ☰
          </button>
        </div>
      </div>
      <nav id="top-nav" class="top-nav">
        <a href="/?region=nong-khiaw">Nong Khiaw</a>
        <a href="/?region=luang-prabang">Luang Prabang</a>
        <a href="/?region=vang-vieng">Vang Vieng</a>
        <a href="/?region=vientiane">Vientiane</a>
        <a href="/?region=khammouane">Thakhek Loop</a>
        <a href="/?region=champasak">Bolaven &amp; South</a>
        <a href="/railway" class="nav-railway desktop-rail-link">🚆 Railway</a>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Built with Rust (Axum + Askama + HTMX + Leaflet). Inspired by regional travel wikis.</p>
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
