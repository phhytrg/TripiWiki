services:
  - type: web
    name: tripiwiki
    runtime: docker
    plan: free
    region: singapore
    autoDeploy: false
    healthCheckPath: /
    envVars:
      - key: GDRIVE_FOLDER_ID
        sync: false
      - key: GDRIVE_PLACES_FOLDER_ID
        sync: false
      - key: GDRIVE_SERVICE_ACCOUNT_JSON
        sync: false
