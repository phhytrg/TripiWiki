<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="tw-sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
  </defs>

  <!-- Rounded tile background -->
  <rect width="64" height="64" rx="15" fill="url(#tw-bg)" />

  <!-- Warm sunrise dot -->
  <circle cx="44" cy="19" r="6.5" fill="url(#tw-sun)" />

  <!-- Twin mountain / karst peaks -->
  <path d="M10 47 L25 22 L36 40 L43 30 L54 47 Z" fill="#ffffff" fill-opacity="0.95" />

  <!-- Subtle winding trail / river curve -->
  <path
    d="M17 47 C24 41, 31 44, 38 38 C43 34, 48 36, 54 47 Z"
    fill="#0f766e"
    fill-opacity="0.28"
  />

  <!-- Compass pin needle accent at main summit -->
  <circle cx="25" cy="22" r="2.6" fill="#f97316" stroke="#ffffff" stroke-width="1.5" />
</svg>
